<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Wi‑Fi振動テスト</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 26px;
    }

    button {
      display: block;
      width: 90%;
      margin: 20px auto;
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
    }

    #status {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📳 振動デバイステスト</h1>

  <button onclick="connectWifi()">
    Wi‑Fi接続
  </button>

  <button onclick="sendVibrate()">
    振動テスト
  </button>

  <div id="status">
    まず「Wi‑Fi接続」を押してください
  </div>

</div>


<script>

  // ========================================
  // Wi‑Fi/WebSocket設定
  // ========================================

  const DEFAULT_WIFI_URL = "ws://192.168.0.10:8080";

  let socket = null;


  // ========================================
  // Wi‑Fi接続
  // ========================================

  function connectWifi() {

    const status = document.getElementById("status");
    const url = prompt("親機の WebSocket URL を入力してください", DEFAULT_WIFI_URL);

    if (!url) return;

    const trimmedUrl = url.trim();

    if (!/^wss?:\/\//i.test(trimmedUrl)) {
      status.textContent = "接続先は ws:// または wss:// で始める必要があります";
      return;
    }

    try {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
      }

      socket = new WebSocket(trimmedUrl);
      status.textContent = "Wi‑Fi接続を開始しています…";

      socket.onopen = () => {
        status.textContent = "✅ Wi‑Fi接続成功！";
      };

      socket.onerror = () => {
        status.textContent = "Wi‑Fi接続に失敗しました。URL を確認してください";
      };

      socket.onclose = () => {
        status.textContent = "Wi‑Fi接続を切断しました";
      };

    } catch (error) {
      console.log(error);
      status.textContent = "Wi‑Fi接続に失敗しました。\n" + error.message;
    }

  }


  // ========================================
  // 振動命令を送る
  // ========================================

  function sendVibrate() {

    const status = document.getElementById("status");

    if (!socket || socket.readyState !== WebSocket.OPEN) {
      status.textContent = "先に「Wi‑Fi接続」を押してください";
      return;
    }

    try {
      const payload = JSON.stringify({
        type: "VIBRATE",
        intensity: 255,
        message: "vibration test"
      });

      socket.send(payload);
      status.textContent = "📳 振動命令を送信しました！";

    } catch (error) {
      console.log(error);
      status.textContent = "振動命令の送信に失敗しました。\n" + error.message;
    }

  }

</script>

</body>
</html>
